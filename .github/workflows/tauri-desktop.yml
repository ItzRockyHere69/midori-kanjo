name: Build and test Tauri desktop installers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_native_offline_sync_test:
        description: Run the real Tauri IndexedDB → Supabase → IndexedDB round-trip test
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tauri-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-shared:
    name: Shared billing, Android and desktop contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the single shared codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Tauri packaging configuration
        run: npm run test:tauri:config

      - name: Lint shared application
        run: npm run lint

      - name: Type-check shared application
        run: npx tsc --noEmit --incremental false

      - name: Test platform, security and migration contracts
        run: npm run test:platform

      - name: Test clean mobile and Android packaging
        run: npm run test:mobile

      - name: Test shared billing and sync logic
        run: npm run test:unit

  build-desktop:
    name: ${{ matrix.label }}
    needs: validate-shared
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows 10/11 · MSI + NSIS EXE
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --bundles msi,nsis
            binary_path: src-tauri/target/release/midori-kanjo.exe
            artifact_name: midori-kanjo-v0.1.2-windows-x64-installers
            artifact_path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*-setup.exe
              SHA256SUMS-windows.txt
              src-tauri/Cargo.lock
          - id: macos-universal
            label: macOS · Universal DMG
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            # Request the application bundle explicitly. Building only the DMG
            # does not guarantee that Tauri keeps bundle/macos/*.app after the
            # disk image has been assembled.
            tauri_args: --target universal-apple-darwin --bundles app,dmg
            binary_path: src-tauri/target/release/midori-kanjo
            artifact_name: midori-kanjo-v0.1.2-macos-universal-dmg
            artifact_path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              SHA256SUMS-macos.txt
              src-tauri/Cargo.lock

    env:
      CARGO_TERM_COLOR: always
      MIDORI_TAURI_BINARY: ${{ github.workspace }}/${{ matrix.binary_path }}
      MIDORI_E2E_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}

    steps:
      - name: Check out the single shared codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve Rust dependencies reproducibly for this release
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Validate native sync-test secrets
        if: ${{ inputs.run_native_offline_sync_test }}
        env:
          MIDORI_E2E_SUPABASE_URL: ${{ secrets.MIDORI_E2E_SUPABASE_URL }}
          MIDORI_E2E_SUPABASE_ANON_KEY: ${{ secrets.MIDORI_E2E_SUPABASE_ANON_KEY }}
          MIDORI_E2E_SYNC_CODE: ${{ secrets.MIDORI_E2E_SYNC_CODE }}
        run: node scripts/require-desktop-e2e-env.mjs

      - name: Build native runner test binary
        if: ${{ inputs.run_native_offline_sync_test }}
        run: npm run tauri:e2e:build

      - name: Test offline create, restart, reconnect and idempotent sync
        if: ${{ inputs.run_native_offline_sync_test }}
        env:
          MIDORI_E2E_SUPABASE_URL: ${{ secrets.MIDORI_E2E_SUPABASE_URL }}
          MIDORI_E2E_SUPABASE_ANON_KEY: ${{ secrets.MIDORI_E2E_SUPABASE_ANON_KEY }}
          MIDORI_E2E_SYNC_CODE: ${{ secrets.MIDORI_E2E_SYNC_CODE }}
        run: npm run test:tauri:e2e

      - name: Clear stale macOS bundle outputs
        if: ${{ matrix.id == 'macos-universal' }}
        shell: bash
        run: |
          rm -rf \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/universal-apple-darwin/release/bundle/dmg"

      - name: Clear stale Windows bundle outputs
        if: ${{ matrix.id == 'windows-x64' }}
        shell: pwsh
        run: |
          $bundlePaths = @(
            "src-tauri/target/release/bundle/msi"
            "src-tauri/target/release/bundle/nsis"
          )
          Remove-Item -Path $bundlePaths -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build production installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          args: ${{ matrix.tauri_args }}

      - name: Verify Windows installer pair and checksums
        if: ${{ matrix.id == 'windows-x64' }}
        shell: pwsh
        run: |
          $msiInstallers = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -File -ErrorAction SilentlyContinue
          )
          $nsisInstallers = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*-setup.exe" -File -ErrorAction SilentlyContinue
          )
          if ($msiInstallers.Count -ne 1) {
            throw "Expected exactly one MSI installer; found $($msiInstallers.Count)."
          }
          if ($nsisInstallers.Count -ne 1) {
            throw "Expected exactly one NSIS installer; found $($nsisInstallers.Count)."
          }
          $installers = @($msiInstallers[0], $nsisInstallers[0])
          $lines = $installers | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS-windows.txt

      - name: Verify universal Mac app, DMG and checksum
        if: ${{ matrix.id == 'macos-universal' }}
        run: npm run verify:macos:universal

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30
