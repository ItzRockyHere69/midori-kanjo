[package]
name = "midori-kanjo"
version = "0.1.1"
description = "Offline-first wholesale billing and inventory software"
authors = ["Sayan Finance"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

[features]
desktop-e2e = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-window-state = "2"
# Registered only in the dedicated runner test build. Production installers do
# not start a WebDriver server.
tauri-plugin-wdio-webdriver = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
